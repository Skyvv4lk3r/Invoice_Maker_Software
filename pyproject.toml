[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-generator-desktop"
version = "0.1.0"
description = "Offline invoice desktop application with an independent Python backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "platformdirs>=4,<5",
  "reportlab>=4,<6",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "import-linter>=2,<3", "build>=1,<2"]
gui-test = ["pytest-qt>=4.4,<5"]

[project.scripts]
invoice-generator = "invoice_generator.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"invoice_generator.presentation.qt" = ["forms/*.ui"]
"invoice_generator.infrastructure.persistence" = ["migrations/*.mako"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["invoice_generator"]
omit = ["*/presentation/qt/*", "*/migrations/*"]

[tool.importlinter]
root_package = "invoice_generator"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Presentation talks only to public application contracts"
type = "forbidden"
source_modules = ["invoice_generator.presentation"]
forbidden_modules = ["invoice_generator.domain", "invoice_generator.application.handlers", "invoice_generator.application.ports", "invoice_generator.infrastructure", "sqlalchemy", "reportlab", "alembic"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["invoice_generator.domain"]
forbidden_modules = ["invoice_generator.application", "invoice_generator.presentation", "invoice_generator.infrastructure", "PySide6", "sqlalchemy", "reportlab"]

[[tool.importlinter.contracts]]
name = "Public contracts contain values and protocols only"
type = "forbidden"
source_modules = ["invoice_generator.application.contracts"]
forbidden_modules = ["invoice_generator.domain", "invoice_generator.infrastructure", "invoice_generator.presentation", "invoice_generator.application.handlers", "PySide6", "sqlalchemy", "reportlab"]

[[tool.importlinter.contracts]]
name = "Use cases depend on ports, never adapters"
type = "forbidden"
source_modules = ["invoice_generator.application.handlers", "invoice_generator.application.ports"]
forbidden_modules = ["invoice_generator.infrastructure", "invoice_generator.presentation", "PySide6", "sqlalchemy", "reportlab"]

[[tool.importlinter.contracts]]
name = "Adapters never import screens or concrete handlers"
type = "forbidden"
source_modules = ["invoice_generator.infrastructure"]
forbidden_modules = ["invoice_generator.presentation", "invoice_generator.application.handlers", "PySide6"]
