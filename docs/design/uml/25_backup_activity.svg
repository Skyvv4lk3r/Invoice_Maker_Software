<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="946px" preserveAspectRatio="none" style="width:1174px;height:946px;background:#FFFFFF;" version="1.1" viewBox="0 0 1174 946" width="1174px" zoomAndPan="magnify"><defs/><g><ellipse cx="698.4512" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="270.625" x="563.1387" y="50"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="250.625" x="573.1387" y="74.8516">Scheduled while app is running</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="239.2656" x="573.1387" y="93.4766">or owner selects Back up now</text><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="363.7656" x="516.5684" y="127.25"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="217.3672" x="526.5684" y="152.1016">Acquire maintenance gate;</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="343.7656" x="526.5684" y="170.7266">pause new writes and drain active workers</text><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="427.2734" x="484.8145" y="204.5"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="356.3906" x="494.8145" y="229.3516">Create SQLite snapshot through backup API;</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="407.2734" x="494.8145" y="247.9766">copy referenced immutable assets and documents</text><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="369.4141" x="513.7441" y="281.75"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="293.5078" x="523.7441" y="306.6016">Write manifest with schema version,</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="349.4141" x="523.7441" y="325.2266">file hashes and sequence high-water marks</text><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="239.6953" x="578.6035" y="359"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="219.6953" x="588.6035" y="383.8516">Release maintenance gate;</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="198.6719" x="588.6035" y="402.4766">resume normal invoicing</text><rect fill="#EFF7FA" height="38.625" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="277.6094" x="559.6465" y="436.25"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="257.6094" x="569.6465" y="461.1016">Verify staged snapshot and files</text><polygon fill="#EAF7F4" points="577.5996,494.875,819.3027,494.875,831.3027,506.875,819.3027,518.875,577.5996,518.875,565.5996,506.875,577.5996,494.875" style="stroke:#147D73;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="241.7031" x="577.5996" y="512.4141">Snapshot complete and valid?</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="27.6484" x="537.9512" y="503.1016">yes</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="19.9297" x="831.3027" y="503.1016">no</text><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="397.8516" x="204.3477" y="528.875"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="377.8516" x="214.3477" y="553.7266">Encrypt archive with authenticated encryption;</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="336.4922" x="214.3477" y="572.3516">use protected key + recovery mechanism</text><rect fill="#EFF7FA" height="38.625" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="256.6797" x="274.9336" y="606.125"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="236.6797" x="284.9336" y="630.9766">Write local backup atomically</text><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="326.6406" x="239.9531" y="664.75"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="306.6406" x="249.9531" y="689.6016">Copy completed archive to configured</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="295.8906" x="249.9531" y="708.2266">cloud-synced folder or external drive</text><polygon fill="#EAF7F4" points="279.4375,742,527.1094,742,539.1094,754,527.1094,766,279.4375,766,267.4375,754,279.4375,742" style="stroke:#147D73;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="247.6719" x="279.4375" y="759.5391">Second-copy write succeeded?</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="27.6484" x="239.7891" y="750.2266">yes</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="19.9297" x="539.1094" y="750.2266">no</text><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="383.0156" x="11" y="776"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="363.0156" x="21" y="800.8516">Record local backup and second-copy status;</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="356.9219" x="21" y="819.4766">cloud folder copy is not remote upload proof</text><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="380.0469" x="414.0156" y="776"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="360.0469" x="424.0156" y="800.8516">Keep local backup; show second-copy failure</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="116.4922" x="424.0156" y="819.4766">and offer retry</text><polygon fill="#EAF7F4" points="403.2734,839.25,415.2734,851.25,403.2734,863.25,391.2734,851.25,403.2734,839.25" style="stroke:#147D73;stroke-width:0.5;"/><rect fill="#EFF7FA" height="57.25" rx="5" ry="5" style="stroke:#35556B;stroke-width:0.5;" width="339.1328" x="824.0625" y="528.875"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="236.2891" x="834.0625" y="553.7266">Keep previous good backups;</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="319.1328" x="834.0625" y="572.3516">record failure and show recovery action</text><polygon fill="#EAF7F4" points="698.4512,869.25,710.4512,881.25,698.4512,893.25,686.4512,881.25,698.4512,869.25" style="stroke:#147D73;stroke-width:0.5;"/><ellipse cx="698.4512" cy="924.25" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="698.4512" cy="924.25" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#456478;stroke-width:1.5;" x1="698.4512" x2="698.4512" y1="30" y2="50"/><polygon fill="#456478" points="694.4512,40,698.4512,50,702.4512,40,698.4512,44" style="stroke:#456478;stroke-width:1;"/><line style="stroke:#456478;stroke-width:1.5;" x1="698.4512" x2="698.4512" y1="107.25" y2="127.25"/><polygon fill="#456478" points="694.4512,117.25,698.4512,127.25,702.4512,117.