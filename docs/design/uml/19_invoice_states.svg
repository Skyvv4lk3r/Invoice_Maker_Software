<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="549px" preserveAspectRatio="none" style="width:1116px;height:549px;background:#FFFFFF;" version="1.1" viewBox="0 0 1116 549" width="1116px" zoomAndPan="magnify"><defs/><g><g id="Draft"><rect fill="#EDF7F5" height="57.25" rx="5" ry="5" style="stroke:#147D73;stroke-width:0.5;" width="218.7266" x="528" y="86"/><line style="stroke:#147D73;stroke-width:0.5;" x1="528" x2="746.7266" y1="114.625" y2="114.625"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="40.6094" x="617.0586" y="105.8516">Draft</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="198.7266" x="533" y="134.4766">edit / autosave / preview</text></g><g id="Issued"><rect fill="#EDF7F5" height="94.5" rx="5" ry="5" style="stroke:#147D73;stroke-width:0.5;" width="488.5781" x="7" y="222"/><line style="stroke:#147D73;stroke-width:0.5;" x1="7" x2="495.5781" y1="250.625" y2="250.625"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="51.5313" x="225.5234" y="241.8516">Issued</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="468.5781" x="12" y="270.4766">clericalCorrection [policy allows] / append revision + audit</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="301.8281" x="12" y="289.1016">recordPayment / append ledger entry</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="336.8281" x="12" y="307.7266">issueAdjustment / link credit or debit note</text></g><rect fill="#EDF7F5" height="40" rx="5" ry="5" style="stroke:#147D73;stroke-width:0.5;" width="88.6484" x="207" y="396"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="78.6484" x="212" y="421.5391">Cancelled</text><rect fill="#EDF7F5" height="47.25" rx="5" ry="5" style="stroke:#147D73;stroke-width:0.5;" width="173.0703" x="937" y="246"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="106.2578" x="942" y="265.8516">Deleted draft</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="163.0703" x="942" y="284.4766">(tombstone + audit)</text><ellipse cx="637.5" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="54" data-uid="ent0003" id="entity_GMN2"><path d="M531,241.5 L531,265.5 L496.26,269.5 L531,273.5 L531,297.375 A5,5 0 0 0 536,302.375 L896.7266,302.375 A5,5 0 0 0 901.7266,297.375 L901.7266,246.5 L891.7266,236.5 L536,236.5 A5,5 0 0 0 531,241.5" fill="#FFF6DE" style="stroke:#D1B46A;stroke-width:0.5;"/><path d="M891.7266,236.5 L891.7266,244 A2.5,2.5 0 0 0 894.2266,246.5 L901.7266,246.5 L891.7266,236.5" fill="#FFF6DE" style="stroke:#D1B46A;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="303.3281" x="537" y="256.3516">Number and financial year are stable.</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="349.7266" x="537" y="274.9766">Financial corrections use adjustment notes.</text><text fill="#000000" font-family="DejaVu Sans" font-size="16" lengthAdjust="spacing" textLength="321.3047" x="537" y="293.6016">Document generation has its own state.</text></g><g class="entity" data-entity="GMN5" data-source-line="59" data-uid="ent0006" id="entity_GMN5"><path d="M74,482 L74,537.875 A5,5 0 0 0 79,542.875 L423.7813,542.875 A5,5 0 0 0 428.7813,537.875 L428.7813,487 L418.7813,477 L255.5,477 L251.5,436.06 L247.5,477 L79,477 A5,5 0 0 0 74,482" fill="#FFF6DE" style="stroke:#D1B46A;stroke-width:0.5;"/><path d="M418.7813,477 L418.7813,484.5 A2.5,2.5 0