name: Bug report
description: Report an application problem using fictional invoice data.
title: '[Bug] '
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behaviour. Use fictional customer data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, application version
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Remove private invoice details, credentials and personal information.
