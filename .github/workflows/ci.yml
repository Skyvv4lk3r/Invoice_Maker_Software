name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: lint-imports
      - run: python -m pytest tests/unit tests/integration tests/architecture --cov=invoice_generator
      - run: python -m build
  desktop:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[desktop,dev,gui-test]"
      - run: python -m pytest tests/gui
      - run: python -m pip install -e ".[packaging]"
      - run: python scripts/build_desktop.py
      - name: Check packaged application
        shell: pwsh
        run: |
          $app = Start-Process -FilePath .\dist\InvoiceGenerator\InvoiceGenerator.exe -ArgumentList '--smoke', '--data-dir', "$env:RUNNER_TEMP\invoice-smoke" -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Packaged startup timed out' }
          if ($app.ExitCode -ne 0) { throw "Packaged startup failed: $($app.ExitCode)" }
      - name: Check packaged document rendering
        shell: pwsh
        run: |
          $demoDir = "$env:RUNNER_TEMP\invoice-demo"
          $app = Start-Process -FilePath .\dist\InvoiceGenerator\InvoiceGenerator.exe -ArgumentList '--demo', '--data-dir', $demoDir -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Packaged demo timed out' }
          if ($app.ExitCode -ne 0) { throw "Packaged demo failed: $($app.ExitCode)" }
          if (-not (Get-ChildItem "$demoDir\exports\*.pdf")) { throw 'Packaged PDF missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceGenerator-Windows-portable
          path: dist/InvoiceGenerator/
          if-no-files-found: error
          retention-days: 14
